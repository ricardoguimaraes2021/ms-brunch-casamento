<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Wedding Brunch</title>
<style>
  :root{
    --olive:#444E43;
    --olive-deep:#333A30;
    --cream:#F7F3EA;
    --cream-ink:#F4F1E5;
    --ink:#272720;
    --ink-soft:#56584F;
    --rust:#AE5B29;
    --rust-deep:#8F4A21;
    --line-on-cream: rgba(39,39,32,0.14);
    --line-on-olive: rgba(244,241,229,0.22);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond','Times New Roman',serif;
    font-weight:600;
    line-height:1.15;
    margin:0;
  }
  .wrap{
    max-width:700px;
    margin:0 auto;
    padding:0 28px;
  }
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    background:var(--olive);
    color:var(--cream-ink);
    padding:22px 28px;
  }
  .header-row{
    max-width:700px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand img{
    width:46px;height:46px;border-radius:50%;
    border:1px solid var(--line-on-olive);
  }
  .brand-name{
    font-family:'Cormorant Garamond',serif;
    font-size:1.05rem;
    letter-spacing:0.02em;
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--line-on-olive);
    border-radius:999px;
    overflow:hidden;
  }
  .lang-toggle button{
    appearance:none;
    border:none;
    background:transparent;
    color:var(--cream-ink);
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    font-weight:500;
    padding:10px 18px;
    min-height:44px;
    cursor:pointer;
    opacity:0.65;
  }
  .lang-toggle button[aria-pressed="true"]{
    background:var(--cream-ink);
    color:var(--olive-deep);
    opacity:1;
  }

  /* ---------- Hero ---------- */
  .hero{
    background:var(--olive);
    color:var(--cream-ink);
    text-align:center;
    padding:72px 28px 84px;
    position:relative;
    overflow:hidden;
  }
  .hero-ring{
    position:absolute;
    border:1px solid var(--line-on-olive);
    border-radius:50%;
    width:560px;height:560px;
    top:-180px;left:50%;
    transform:translateX(-50%);
    pointer-events:none;
  }
  .hero-kicker{
    font-size:0.95rem;
    color:#D8CBB5;
    margin-bottom:14px;
  }
  .hero h1{
    font-size:3.4rem;
    line-height:1.05;
    letter-spacing:0.01em;
  }
  .hero-sub{
    max-width:480px;
    margin:20px auto 0;
    font-size:1.05rem;
    line-height:1.55;
    color:#E5E0D2;
  }
  .price-badge{
    display:inline-block;
    margin-top:34px;
    background:var(--rust);
    color:var(--cream-ink);
    padding:12px 28px;
    border-radius:999px;
    font-family:'Cormorant Garamond',serif;
    font-size:1.25rem;
  }
  .price-note{
    margin-top:14px;
    font-size:0.95rem;
    color:#DCD1BC;
  }

  /* ---------- Section scaffolding ---------- */
  section{padding:64px 0;}
  .section-title{
    font-size:2rem;
    line-height:1.15;
    margin-bottom:8px;
  }
  .section-intro{
    color:var(--ink-soft);
    font-size:1rem;
    line-height:1.5;
    margin-bottom:36px;
    max-width:480px;
  }

  /* ---------- Menu ---------- */
  .menu .section-intro{margin-bottom:14px;}
  .menu-legend{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    column-gap:18px;
    row-gap:10px;
    margin:0 0 36px;
  }
  .menu-legend-label{
    font-size:0.88rem;
    color:var(--ink-soft);
  }
  .menu-legend-item{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:0.88rem;
    color:var(--ink-soft);
  }
  .menu-legend-item .diet-icon{color:var(--rust-deep);}
  .menu-group + .menu-group{margin-top:40px;}
  .menu-group h3{
    font-style:italic;
    font-weight:500;
    font-size:1.4rem;
    color:var(--rust-deep);
    margin-bottom:4px;
  }
  .menu-list{
    list-style:none;
    margin:14px 0 0;
    padding:0;
  }
  .menu-list li{
    padding:14px 0;
    border-top:1px solid var(--line-on-cream);
    font-size:1.05rem;
    line-height:1.45;
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    column-gap:8px;
  }
  .menu-list li:last-child{border-bottom:1px solid var(--line-on-cream);}
  .diet-icon{
    display:inline-flex;
    width:17px;height:17px;
    color:var(--rust-deep);
    opacity:0.85;
  }
  .diet-icon svg{width:100%;height:100%;}
  .allergen-tags{
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .veg-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-family:'Inter',sans-serif;
    font-size:0.8rem;
    font-weight:600;
    letter-spacing:0.02em;
    color:#4C6B4A;
    background:#E7ECE2;
    border-radius:999px;
    padding:4px 11px 4px 8px;
  }
  .veg-tag .diet-icon{width:14px;height:14px;color:#4C6B4A;}
  .drinks-text{
    margin-top:14px;
    font-size:1.05rem;
    line-height:1.6;
    color:var(--ink);
  }

  /* ---------- Included ---------- */
  .included{
    background:var(--olive);
    color:var(--cream-ink);
  }
  .included .section-title, .included .section-intro{color:var(--cream-ink);}
  .included .section-intro{color:#CFC8B6;}
  .included-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:40px;
  }
  .included-grid h3{
    font-size:1.1rem;
    font-weight:600;
    font-family:'Inter',sans-serif;
    text-transform:none;
    margin-bottom:14px;
    color:#E9E4D4;
  }
  .included-grid ul{
    list-style:none;
    margin:0;padding:0;
    font-size:1rem;
    line-height:1.5;
    color:#DDD8C9;
  }
  .included-grid li{
    padding:10px 0;
    border-top:1px solid var(--line-on-olive);
  }
  .extras-note{
    margin-top:16px;
    font-size:0.95rem;
    line-height:1.5;
    color:#C3BCA6;
  }
  @media (max-width:560px){
    .included-grid{grid-template-columns:1fr;gap:30px;}
  }

  /* ---------- Conditions ---------- */
  .conditions-box{
    border:1px solid var(--line-on-cream);
    padding:30px 32px;
  }
  .conditions-box ul{
    margin:0;padding:0;
    list-style:none;
    font-size:1rem;
    line-height:1.6;
    color:#44463D;
  }
  .conditions-box li{
    padding:10px 0;
    border-top:1px solid var(--line-on-cream);
  }
  .conditions-box li:first-child{border-top:none;padding-top:0;}

  /* ---------- CTA ---------- */
  .cta{
    background:var(--olive-deep);
    color:var(--cream-ink);
    text-align:center;
  }
  .cta h2{font-size:2rem;}
  .cta p{
    margin:14px auto 0;
    max-width:420px;
    color:#D8D3C3;
    font-size:1rem;
    line-height:1.55;
  }
  .cta-button{
    display:inline-block;
    margin-top:30px;
    background:var(--rust);
    color:var(--cream-ink);
    text-decoration:none;
    padding:15px 34px;
    border-radius:999px;
    font-size:1rem;
    font-weight:600;
    transition:background 0.15s ease;
  }
  .cta-button:hover{background:var(--rust-deep);}
  .cta-button:focus-visible{outline:2px solid var(--cream-ink);outline-offset:3px;}
  .cta-contact{
    margin-top:22px;
    font-size:1rem;
    line-height:1.6;
    color:#C3BCA6;
  }
  .cta-contact a{text-decoration:underline;text-underline-offset:3px;}

  /* ---------- Footer ---------- */
  footer{
    background:var(--olive-deep);
    color:#BFB9A4;
    text-align:center;
    padding:34px 28px 40px;
    font-size:0.9rem;
    line-height:1.6;
    border-top:1px solid var(--line-on-olive);
  }
  footer .foot-brand{
    font-family:'Cormorant Garamond',serif;
    font-size:1.2rem;
    color:var(--cream-ink);
    margin-bottom:8px;
  }
  footer p{margin:5px 0;}

  @media (max-width:560px){
    .wrap{padding:0 22px;}
    .hero{padding:52px 22px 60px;}
    .hero h1{font-size:2.6rem;}
    .hero-sub{font-size:1rem;}
    section{padding:48px 0;}
    .section-title{font-size:1.7rem;}
    .cta h2{font-size:1.7rem;}
    .conditions-box{padding:24px 22px;}
    .lang-toggle button{padding:9px 15px;}
  }

  @media (prefers-reduced-motion: reduce){
    .cta-button{transition:none;}
  }
</style>
</head>

  function makeIcon(code, label){
    const span = document.createElement('span');
    span.className = 'diet-icon diet-icon-' + code;
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON_PATHS[code] + '</svg>';
    if (label) span.setAttribute('title', label);
    return span;
  }

  function render(lang){
    const dict = translations[lang];
    document.documentElement.lang = lang === 'pt' ? 'pt-PT' : 'en';

    document.querySelectorAll('[data-i18n]').forEach(function(el){
      const key = el.getAttribute('data-i18n');
      if (dict[key] !== undefined) el.textContent = dict[key];
    });

    document.querySelectorAll('[data-i18n-list]').forEach(function(el){
      const key = el.getAttribute('data-i18n-list');
      const items = dict[key] || [];
      el.innerHTML = '';
      items.forEach(function(item){
        const li = document.createElement('li');
        if (typeof item === 'string'){
          li.textContent = item;
        } else {
          li.appendChild(document.createTextNode(item.t));
          if (item.a && item.a.length){
            const wrap = document.createElement('span');
            wrap.className = 'allergen-tags';
            item.a.forEach(function(code){
              wrap.appendChild(makeIcon(code, dict.allergenLabels[code]));
            });
            li.appendChild(wrap);
          }
          if (item.v){
            const tag = document.createElement('span');
            tag.className = 'veg-tag';
            tag.appendChild(makeIcon('vegan', dict.veganLabel));
            const label = document.createElement('span');
            label.textContent = dict.veganLabel;
            tag.appendChild(label);
            li.appendChild(tag);
          }
        }
        el.appendChild(li);
      });
    });

    const legendEl = document.getElementById('menuLegend');
    if (legendEl){
      legendEl.innerHTML = '';
      const label = document.createElement('span');
      label.className = 'menu-legend-label';
      label.textContent = dict.menuLegendLabel + ':';
      legendEl.appendChild(label);
      ['gluten','egg','fish','dairy'].forEach(function(code){
        const item = document.createElement('span');
        item.className = 'menu-legend-item';
        item.appendChild(makeIcon(code));
        const text = document.createElement('span');
        text.textContent = dict.allergenLabels[code];
        item.appendChild(text);
        legendEl.appendChild(item);
      });
    }

    document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
      btn.setAttribute('aria-pressed', btn.getAttribute('data-lang-btn') === lang ? 'true' : 'false');
    });
  }

  document.querySelectorAll('[data-lang-btn]').forEach(function(btn){
    btn.addEventListener('click', function(){
      render(btn.getAttribute('data-lang-btn'));
    });
  });
